global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # 1. Self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # 2. CPU / memory of the host (node-exporter)
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']

  # ---------- App running in DOCKER COMPOSE ----------
  # 3. OpsGuard API and request rate (Member 1)
  - job_name: 'opsguard-backend-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['backend:8000']

  # 4. Redis queue metrics (Member 2 worker queue)
  - job_name: 'redis-queue-exporter'
    static_configs:
      - targets: ['redis-exporter:9121']

  # ---------- App running in KUBERNETES (Docker Desktop) ----------
  # Kubernetes publishes these ports on the laptop, and Prometheus (a container)
  # reaches the laptop through the name host.docker.internal.
  # Only one of the two sets is UP at a time, which is normal. Check http://localhost:9090/targets
  - job_name: 'opsguard-backend-k8s'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:8000']

  - job_name: 'redis-queue-exporter-k8s'
    static_configs:
      - targets: ['host.docker.internal:9121']

  # 5. Kubernetes pod health (kube-state-metrics, see monitoring/k8s/monitoring.yaml)
  - job_name: 'kubernetes-state'
    static_configs:
      - targets: ['host.docker.internal:8082']
