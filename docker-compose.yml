# Owner: Member 3. Starter: shared PostgreSQL + Redis for everyone.
# Add backend, worker and frontend services as their Dockerfiles are created.
services:
  postgres:
    image: postgres:16
    container_name: opsguard-postgres
    environment:
      POSTGRES_USER: opsguard_user
      POSTGRES_PASSWORD: opsguard_password
      POSTGRES_DB: opsguard_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opsguard_user -d opsguard_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: opsguard-redis
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    image: opsguard-backend:v1
    container_name: opsguard-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://opsguard_user:opsguard_password@postgres:5432/opsguard_db
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  postgres_data: