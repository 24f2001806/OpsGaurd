version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: opsguard-postgres
    environment:
      POSTGRES_USER: opsguard
      POSTGRES_PASSWORD: opsguard_password
      POSTGRES_DB: opsguard_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: opsguard-redis
    ports:
      - "6379:6379"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: opsguard-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data: